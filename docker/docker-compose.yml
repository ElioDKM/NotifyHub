services:
  postgres:
    image: postgres:16
    container_name: notifyhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # dev only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [notifyhub_net]

  redis:
    image: redis:7-alpine
    container_name: notifyhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # dev only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [notifyhub_net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notifyhub-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [notifyhub_net]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: notifyhub-api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [notifyhub_net]
    working_dir: /app
    volumes:
    - ..:/app
    - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    command: sh -c "pnpm prisma generate && pnpm run start:dev"

volumes:
  postgres_data:

networks:
  notifyhub_net:
    driver: bridge