name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://notifyhubAdmin:notify9486@postgres:5432/notifyhub?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Lint
        run: pnpm run lint:check

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Docker build
        run: docker build -f docker/Dockerfile -t notifyhub:ci .